name: Attach verified BBB 1.3.6 package
on:
  push:
    branches: [release-assets-bbb136]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the verified install package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          gh release download v1.3.5 --pattern BirdBook-Bridge-1.3.5.zip --dir out
          cat release-transfer/[0-9][0-9] > out/patch.json
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          out = Path('out')
          patch = json.loads((out / 'patch.json').read_bytes())
          before = (out / 'BirdBook-Bridge-1.3.5.zip').read_bytes()
          assert hashlib.sha256(before).hexdigest() == patch['old_sha256']
          after = b''.join(before[p[0]:p[0]+p[1]] if isinstance(p, list)
                           else base64.b64decode(p) for p in patch['parts'])
          expected = '400023c1094d267a425b9cfab4f069aa9d531ddac96aa68b35e15ee13c158f19'
          assert hashlib.sha256(after).hexdigest() == patch['new_sha256'] == expected
          name = 'BirdBook-Bridge-1.3.6.zip'
          (out / name).write_bytes(after)
          (out / 'SHA256SUMS.txt').write_text(f'{expected}  {name}\n')
          PY
          gh release upload v1.3.6 out/BirdBook-Bridge-1.3.6.zip out/SHA256SUMS.txt
