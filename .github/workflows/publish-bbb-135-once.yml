name: Publish validated BBB 1.3.5 (one time)
on:
  push:
    paths:
      - '.github/workflows/publish-bbb-135-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Jocioi/BirdBook-Bridge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct the exact locally validated package
        run: |
          gh release download v1.3.4 --pattern BirdBook-Bridge-1.3.4.zip
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          p=json.loads(Path('.github/release-package-135.json').read_text())
          old=Path('BirdBook-Bridge-1.3.4.zip').read_bytes()
          assert hashlib.sha256(old).hexdigest()==p['old_sha256']
          data=b''.join(old[v['old'][0]:v['old'][0]+v['old'][1]] if 'old' in v else base64.b64decode(v['data']) for v in p['parts'])
          assert hashlib.sha256(data).hexdigest()==p['new_sha256']
          Path('BirdBook-Bridge-1.3.5.zip').write_bytes(data)
          with zipfile.ZipFile('BirdBook-Bridge-1.3.5.zip') as z:
              assert z.testzip() is None
              assert b'revision = 5' in z.read('BirdBookBridge.lrplugin/Info.lua')
          Path('SHA256SUMS.txt').write_text(p['new_sha256']+'  BirdBook-Bridge-1.3.5.zip\n')
          PY
      - name: Publish release and checksum
        run: |
          cat > release-notes.md <<'NOTES'
          ## BBB 1.3.5 · 拉直旋转与对焦框修复

          - 支持 Lightroom 拉直旋转与裁切、横竖拍方向、轻微镜头配置文件校正叠加；经图像匹配验证后输出参考对焦框。
          - 修复较大正负旋转角度导致裁切对角坐标倒序时的误拒绝。
          - 对焦框中心仍在画面内时保留可见部分；中心已被裁掉时不输出。
          - 修复白平衡文字值引起的数字转换警告。
          - 299 项自动检查通过；三组真实照片副本及小鸟书生产读取代码验证通过。用户已确认本机更新可用。

          下载 **BirdBook-Bridge-1.3.5.zip** 安装包，Source code 需要自行构建。替换插件后，已有照片须重新导出并导入小鸟书。

          SHA-256: `d933889eeb8acf9791b579ee524b7c0842b75fcf67eab90de3293e5f1861e3f3`

          仍为开发预览版；Intel 仅完成编译，参考框不是像素级光学精度证明。透视、手动畸变、相机 JPG 几何及匹配不可靠的情形继续保留保护限制。
          NOTES
          gh release create v1.3.5 BirdBook-Bridge-1.3.5.zip SHA256SUMS.txt --target c47ba0ae81c5564884b860624ad2aa63d734ffa8 --title 'BBB 1.3.5 · 拉直旋转与对焦框修复' --notes-file release-notes.md --prerelease --verify-tag=false
